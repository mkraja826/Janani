name: M14 M12 Status

on:
  push:
    branches:
      - codex/janani-product-redesign-m14
    paths:
      - .github/workflows/m14-m12-status.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m14
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('JANANI_REDESIGN_PROGRESS.md')
          s = p.read_text()
          old = '| 12 | Multilingual product foundation | Implementation complete / native + live backend + critical-safety language gates pending | 0 |'
          new = '| 12 | Multilingual product foundation | Engineering/native complete / live backend + critical-safety language gates pending | 0 |'
          if old not in s:
              raise SystemExit('M12 tracker target missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mkraja826@users.noreply.github.com"
          git add JANANI_REDESIGN_PROGRESS.md
          git commit -m "Record M12 native validation"
          git push origin HEAD:codex/janani-product-redesign-m14
