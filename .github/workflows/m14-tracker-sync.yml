name: M14 Tracker Sync

on:
  push:
    branches:
      - codex/janani-product-redesign-m14
    paths:
      - .github/workflows/m14-tracker-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m14
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('JANANI_REDESIGN_PROGRESS.md')
          s = p.read_text()
          changes = {
            '| 11 | Emotional tone system | Not started | 0 |': '| 11 | Emotional tone system | Engineering/native complete / live AI deployment blocked | 0 |',
            '| 12 | Multilingual product layer | Not started | 0 |': '| 12 | Multilingual product foundation | Implementation complete / native + live backend + critical-safety language gates pending | 0 |',
            '| 13 | Mother/partner/clinician + physical-device UX validation | Not started | 0 |': '| 13 | Mother/partner/clinician + physical-device UX validation | Validation harness complete / real sessions pending | 0 |',
            '| 14 | Production release gates | Not started | 0 |': '| 14 | Production release gates | Gate framework complete / release blocked | 0 |',
          }
          for old, new in changes.items():
              if old not in s:
                  raise SystemExit(f'tracker target missing: {old}')
              s = s.replace(old, new, 1)
          marker = '**Counted progress: 71%.** Milestone 6\'s infrastructure is intentionally not counted because no clinician-reviewed, source-backed clinical rule pack is active yet.'
          addition = marker + '\n\nM11–M14 also remain uncounted until their acceptance evidence is complete. M11/M12 live AI deployment is currently blocked by connected Supabase permissions; M12 critical safety translations require review; M13 requires real physical-device/clinician sessions; M14 requires every release gate to pass.'
          if addition not in s:
              if marker not in s:
                  raise SystemExit('progress marker missing')
              s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mkraja826@users.noreply.github.com"
          git add JANANI_REDESIGN_PROGRESS.md
          git commit -m "Sync redesign tracker through M14"
          git push origin HEAD:codex/janani-product-redesign-m14
