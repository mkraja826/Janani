name: Janani 1.0 RC AAB

on:
  push:
    branches:
      - release/janani-1.0.0-rc1-20260822
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  VERSION_NAME: '1.0.0'
  VERSION_CODE: '9'

jobs:
  bundle:
    if: github.event_name == 'push' || github.head_ref == 'release/janani-1.0.0-rc1-20260822'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm run audit:production

      - name: Validate required production configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          EXPO_PUBLIC_CARE_PLUS_VISIBLE: ${{ vars.EXPO_PUBLIC_CARE_PLUS_VISIBLE || 'false' }}
          EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED: 'false'
          EXPO_PUBLIC_CARE_PLUS_AI_ENABLED: ${{ vars.EXPO_PUBLIC_CARE_PLUS_AI_ENABLED || 'false' }}
        run: npm run validate:production-config

      - name: Materialize Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JANANI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/janani-release.keystore"
          chmod 600 "$RUNNER_TEMP/janani-release.keystore"

      - name: Set release version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = process.env.VERSION_NAME;
          app.expo.android.versionCode = Number(process.env.VERSION_CODE);
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Clean Android prebuild
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          EXPO_PUBLIC_CARE_PLUS_VISIBLE: ${{ vars.EXPO_PUBLIC_CARE_PLUS_VISIBLE || 'false' }}
          EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED: 'false'
          EXPO_PUBLIC_CARE_PLUS_AI_ENABLED: ${{ vars.EXPO_PUBLIC_CARE_PLUS_AI_ENABLED || 'false' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build production AAB
        working-directory: android
        env:
          JANANI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/janani-release.keystore
          JANANI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JANANI_ANDROID_KEYSTORE_PASSWORD }}
          JANANI_ANDROID_KEY_ALIAS: ${{ secrets.JANANI_ANDROID_KEY_ALIAS }}
          JANANI_ANDROID_KEY_PASSWORD: ${{ secrets.JANANI_ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify signed AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > janani-1.0.0-9.sha256

      - name: Upload signed RC AAB
        uses: actions/upload-artifact@v4
        with:
          name: janani-1.0.0-9-signed-rc-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            janani-1.0.0-9.sha256
          if-no-files-found: error
          retention-days: 7
