name: M12 AI Language

on:
  push:
    branches:
      - codex/janani-product-redesign-m12
    paths:
      - .github/workflows/m12-ai-language.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m12
      - run: python scripts/m12_wire_ai_language.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mkraja826@users.noreply.github.com"
          git add supabase/functions/janani-ai/index.ts
          git commit -m "Respect account language in Ask Janani"
          git push origin HEAD:codex/janani-product-redesign-m12
