name: Janani Signed AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name, e.g. 1.0.0
        required: true
      version_code:
        description: Positive Android version code
        required: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
  EXPO_PUBLIC_RELEASE_CANDIDATE: 'true'

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Require current main release head
        run: |
          git fetch origin main --depth=1
          current_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          echo "Release checkout: $current_sha"
          echo "Current main:     $main_sha"
          if [ "$current_sha" != "$main_sha" ]; then
            echo "Refusing stale production build. Start a fresh workflow dispatch from current main instead of re-running an older release run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Preflight production release configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          JANANI_ANDROID_KEYSTORE_BASE64: ${{ secrets.JANANI_ANDROID_KEYSTORE_BASE64 }}
          JANANI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JANANI_ANDROID_KEYSTORE_PASSWORD }}
          JANANI_ANDROID_KEY_ALIAS: ${{ secrets.JANANI_ANDROID_KEY_ALIAS }}
          JANANI_ANDROID_KEY_PASSWORD: ${{ secrets.JANANI_ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          missing=0
          for item in \
            EXPO_PUBLIC_SUPABASE_URL \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            EXPO_PUBLIC_SUPPORT_EMAIL \
            EXPO_PUBLIC_PRIVACY_URL \
            EXPO_PUBLIC_ACCOUNT_DELETION_URL \
            JANANI_ANDROID_KEYSTORE_BASE64 \
            JANANI_ANDROID_KEYSTORE_PASSWORD \
            JANANI_ANDROID_KEY_ALIAS \
            JANANI_ANDROID_KEY_PASSWORD; do
            if [ -z "${!item}" ]; then
              echo "Missing required production release value: $item"
              missing=1
            fi
          done
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$'; then
            echo "Invalid version_name: expected semantic version format."
            missing=1
          fi
          if ! printf '%s' "$VERSION_CODE" | grep -Eq '^[1-9][0-9]*$'; then
            echo "Invalid version_code: expected a positive integer."
            missing=1
          fi
          test "$missing" -eq 0
          echo "Production release preflight passed."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm run audit:production

      - name: Validate required production configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          EXPO_PUBLIC_CARE_PLUS_VISIBLE: 'true'
          EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED: 'false'
          EXPO_PUBLIC_CARE_PLUS_AI_ENABLED: 'true'
        run: npm run validate:production-config

      - name: Materialize Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JANANI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/janani-release.keystore"
          chmod 600 "$RUNNER_TEMP/janani-release.keystore"

      - name: Set release version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const versionName = process.env.VERSION_NAME;
          const versionCode = Number(process.env.VERSION_CODE);
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = versionName;
          app.expo.android.versionCode = versionCode;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Clean Android prebuild
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          EXPO_PUBLIC_CARE_PLUS_VISIBLE: 'true'
          EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED: 'false'
          EXPO_PUBLIC_CARE_PLUS_AI_ENABLED: 'true'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build production AAB
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          EXPO_PUBLIC_CARE_PLUS_VISIBLE: 'true'
          EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED: 'false'
          EXPO_PUBLIC_CARE_PLUS_AI_ENABLED: 'true'
          JANANI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/janani-release.keystore
          JANANI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JANANI_ANDROID_KEYSTORE_PASSWORD }}
          JANANI_ANDROID_KEY_ALIAS: ${{ secrets.JANANI_ANDROID_KEY_ALIAS }}
          JANANI_ANDROID_KEY_PASSWORD: ${{ secrets.JANANI_ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify signed AAB
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab > janani-release.sha256
          {
            echo "commit=$GITHUB_SHA"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "release_candidate=true"
            echo "care_plus_visible=true"
            echo "care_plus_ai=true"
            echo "care_plus_purchases=false"
          } > janani-release-metadata.txt

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: janani-${{ inputs.version_name }}-${{ inputs.version_code }}-signed-aab
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            janani-release.sha256
            janani-release-metadata.txt
          if-no-files-found: error
          retention-days: 7
