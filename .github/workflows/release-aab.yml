name: Janani Signed AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name, e.g. 1.0.0
        required: true
      version_code:
        description: Positive Android version code
        required: true

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate required production configuration
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          EXPO_PUBLIC_CARE_PLUS_VISIBLE: ${{ vars.EXPO_PUBLIC_CARE_PLUS_VISIBLE || 'false' }}
          EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED: ${{ vars.EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED || 'false' }}
          EXPO_PUBLIC_CARE_PLUS_AI_ENABLED: ${{ vars.EXPO_PUBLIC_CARE_PLUS_AI_ENABLED || 'false' }}
        run: npm run validate:production-config

      - name: Materialize Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JANANI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/janani-release.keystore"
          chmod 600 "$RUNNER_TEMP/janani-release.keystore"

      - name: Set release version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const versionName = process.env.VERSION_NAME;
          const versionCode = Number(process.env.VERSION_CODE);
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(versionName)) throw new Error('Invalid version_name');
          if (!Number.isInteger(versionCode) || versionCode <= 0) throw new Error('Invalid version_code');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = versionName;
          app.expo.android.versionCode = versionCode;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Clean Android prebuild
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
          EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
          EXPO_PUBLIC_ACCOUNT_DELETION_URL: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_URL }}
          EXPO_PUBLIC_CARE_PLUS_VISIBLE: ${{ vars.EXPO_PUBLIC_CARE_PLUS_VISIBLE || 'false' }}
          EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED: ${{ vars.EXPO_PUBLIC_CARE_PLUS_PURCHASES_ENABLED || 'false' }}
          EXPO_PUBLIC_CARE_PLUS_AI_ENABLED: ${{ vars.EXPO_PUBLIC_CARE_PLUS_AI_ENABLED || 'false' }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build production AAB
        working-directory: android
        env:
          JANANI_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/janani-release.keystore
          JANANI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JANANI_ANDROID_KEYSTORE_PASSWORD }}
          JANANI_ANDROID_KEY_ALIAS: ${{ secrets.JANANI_ANDROID_KEY_ALIAS }}
          JANANI_ANDROID_KEY_PASSWORD: ${{ secrets.JANANI_ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: janani-${{ inputs.version_name }}-${{ inputs.version_code }}-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
