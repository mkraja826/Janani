name: Janani Staging Backend Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only staging contracts
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run staging backend smoke
        env:
          JANANI_STAGING_CONFIRM: STAGING_ONLY
          JANANI_STAGING_SUPABASE_URL: ${{ secrets.JANANI_STAGING_SUPABASE_URL }}
          JANANI_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.JANANI_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          JANANI_STAGING_TEST_EMAIL: ${{ secrets.JANANI_STAGING_TEST_EMAIL }}
          JANANI_STAGING_TEST_PASSWORD: ${{ secrets.JANANI_STAGING_TEST_PASSWORD }}
        run: node scripts/staging-backend-smoke.mjs
