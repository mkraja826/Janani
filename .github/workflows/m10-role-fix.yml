name: M10 Role Resolution Fix

on:
  push:
    branches:
      - codex/janani-product-redesign-m10
    paths:
      - .github/workflows/m10-role-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m10
      - name: Scope family role lookup to current user
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/partner-family.tsx')
          s = p.read_text()
          old = """    const membership = await supabase.from('family_members').select('role').maybeSingle();\n    if (membership.error || !membership.data) {"""
          new = """    const { data: authData, error: authError } = await supabase.auth.getUser();\n    const userId = authData.user?.id;\n    if (authError || !userId) {\n      setLoadError(true);\n      setLoading(false);\n      return;\n    }\n    const membership = await supabase\n      .from('family_members')\n      .select('role')\n      .eq('user_id', userId)\n      .maybeSingle();\n    if (membership.error || !membership.data) {"""
          if old not in s:
              raise SystemExit('membership target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/partner-family.tsx
          git commit -m "Scope Partner and Family role lookup to current user"
          git push origin HEAD:codex/janani-product-redesign-m10
