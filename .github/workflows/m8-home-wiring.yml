name: M8 Home Wiring

on:
  push:
    branches:
      - codex/janani-product-redesign-m8
    paths:
      - .github/workflows/m8-home-wiring.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m8
      - name: Wire daily personalization and private invalidations into Home
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main/home.tsx')
          s = p.read_text()

          anchor = "import { cacheActivePregnancyId } from '@/features/pregnancy/activePregnancy';\n"
          addition = "import {\n  getCurrentDailyPersonalization,\n  parseDailyPersonalization,\n  type DailyPersonalization,\n} from '@/features/home/dailyPersonalization';\n"
          if addition not in s:
              s = s.replace(anchor, addition + anchor, 1)

          anchor = "import { colors, radius, spacing } from '@/theme/tokens';\n"
          addition = "import { subscribeToUserInvalidations } from '@/features/user/userInvalidation';\n"
          if addition not in s:
              s = s.replace(anchor, addition + anchor, 1)

          old = """type HomeCache = {\n  date: string;\n  summary: FamilySummary;\n  reminders: HomeReminder[];\n  logs: HomeReminderLog[];\n};"""
          new = """type HomeCache = {\n  date: string;\n  summary: FamilySummary;\n  reminders: HomeReminder[];\n  logs: HomeReminderLog[];\n  personalization?: DailyPersonalization | null;\n};"""
          if old not in s: raise SystemExit('HomeCache target missing')
          s = s.replace(old, new, 1)

          anchor = """function reminderIcon(kind: HomeReminder['kind']) {\n  if (kind === 'medication') return 'medical-outline' as const;\n  if (kind === 'hydration') return 'water-outline' as const;\n  if (kind === 'nutrition') return 'nutrition-outline' as const;\n  if (kind === 'appointment') return 'calendar-outline' as const;\n  return 'alarm-outline' as const;\n}\n"""
          addition = """\nfunction personalizationPresentation(item: DailyPersonalization) {\n  switch (item.actionType) {\n    case 'review_report':\n      return {\n        icon: 'document-text-outline' as const,\n        title: 'Your report is ready for your eyes',\n        body: `${item.pendingReportReviewCount} value${item.pendingReportReviewCount === 1 ? '' : 's'} Janani read ${item.pendingReportReviewCount === 1 ? 'is' : 'are'} waiting for you to confirm.`,\n        route: '/main/reports' as const,\n      };\n    case 'upcoming_appointment': {\n      const scheduledAt = typeof item.actionMeta.scheduledAt === 'string'\n        ? new Date(item.actionMeta.scheduledAt)\n        : null;\n      const timing = scheduledAt && !Number.isNaN(scheduledAt.getTime())\n        ? scheduledAt.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })\n        : 'soon';\n      return {\n        icon: 'calendar-outline' as const,\n        title: 'Your next appointment is coming up',\n        body: `It is scheduled for ${timing}. Keep anything you want to ask your care team close by.`,\n        route: '/main/health' as const,\n      };\n    }\n    case 'complete_health_profile':\n      return {\n        icon: 'heart-outline' as const,\n        title: 'Help Janani understand you a little better',\n        body: 'A few everyday details are still missing. Adding them makes future suggestions more relevant without changing your medical care.',\n        route: '/edit-health-profile' as const,\n      };\n    case 'ask_food_ideas':\n      return {\n        icon: 'nutrition-outline' as const,\n        title: 'Your food preferences are ready to use',\n        body: 'Ask Janani for simple meal ideas that fit the preferences and allergies you saved.',\n        route: '/main/ask' as const,\n      };\n    default:\n      return {\n        icon: 'leaf-outline' as const,\n        title: 'See what this week brings',\n        body: 'Your current pregnancy week is ready in Journey whenever you want it.',\n        route: '/main/journey' as const,\n      };\n  }\n}\n"""
          if addition not in s:
              if anchor not in s: raise SystemExit('presentation anchor missing')
              s = s.replace(anchor, anchor + addition, 1)

          anchor = """  const [logs, setLogs] = useState<HomeReminderLog[]>([]);\n"""
          addition = """  const [personalization, setPersonalization] = useState<DailyPersonalization | null>(null);\n"""
          if addition not in s:
              s = s.replace(anchor, anchor + addition, 1)

          old = """    setLogs([]);\n    setLoadError(false);"""
          new = """    setLogs([]);\n    setPersonalization(null);\n    setLoadError(false);"""
          if old not in s: raise SystemExit('reset target missing')
          s = s.replace(old, new, 1)

          old = """      setLogs(validCache.logs);\n      setLoading(false);"""
          new = """      setLogs(validCache.logs);\n      setPersonalization(validCache.personalization ?? null);\n      setLoading(false);"""
          if old not in s: raise SystemExit('cache target missing')
          s = s.replace(old, new, 1)

          old = """    const [family, reminderItems, reminderHistory] = await Promise.all([\n      supabase\n        .from('families')"""
          new = """    const [family, reminderItems, reminderHistory, personalizationResult] = await Promise.all([\n      supabase\n        .from('families')"""
          if old not in s: raise SystemExit('Promise tuple target missing')
          s = s.replace(old, new, 1)

          old = """      supabase\n        .from('reminder_logs')\n        .select('reminder_id,scheduled_for,state')\n        .gte('scheduled_for', start.toISOString())\n        .lt('scheduled_for', end.toISOString()),\n    ]);"""
          new = """      supabase\n        .from('reminder_logs')\n        .select('reminder_id,scheduled_for,state')\n        .gte('scheduled_for', start.toISOString())\n        .lt('scheduled_for', end.toISOString()),\n      membership.data.role === 'mother'\n        ? getCurrentDailyPersonalization()\n        : Promise.resolve({ data: null, error: null }),\n    ]);"""
          if old not in s: raise SystemExit('Promise tail target missing')
          s = s.replace(old, new, 1)

          old = """    const nextLogs = (reminderHistory.data ?? []) as HomeReminderLog[];\n\n    setSummary(nextSummary);\n    setReminders(nextReminders);\n    setLogs(nextLogs);"""
          new = """    const nextLogs = (reminderHistory.data ?? []) as HomeReminderLog[];\n    const nextPersonalization = membership.data.role === 'mother' && !personalizationResult.error\n      ? parseDailyPersonalization(personalizationResult.data)\n      : validCache?.personalization ?? null;\n\n    setSummary(nextSummary);\n    setReminders(nextReminders);\n    setLogs(nextLogs);\n    setPersonalization(nextPersonalization);"""
          if old not in s: raise SystemExit('state target missing')
          s = s.replace(old, new, 1)

          old = """        reminders: nextReminders,\n        logs: nextLogs,\n      }),"""
          new = """        reminders: nextReminders,\n        logs: nextLogs,\n        personalization: nextPersonalization,\n      }),"""
          if old not in s: raise SystemExit('cache write target missing')
          s = s.replace(old, new, 1)

          anchor = """  useEffect(() => {\n    const stopInvalidations = onFamilyInvalidation("""
          user_effect = """  useEffect(() => {\n    const accessToken = session?.access_token;\n    if (!userId || !accessToken) return undefined;\n    return subscribeToUserInvalidations({\n      userId,\n      accessToken,\n      onInvalidate: () => void load(),\n      onConnectionIssue: () => undefined,\n    });\n  }, [load, session?.access_token, userId]);\n\n"""
          if user_effect not in s:
              if anchor not in s: raise SystemExit('invalidation effect anchor missing')
              s = s.replace(anchor, user_effect + anchor, 1)

          anchor = """  const priority = care.priority;\n"""
          addition = """  const personalizedAction = personalization ? personalizationPresentation(personalization) : null;\n"""
          if addition not in s:
              s = s.replace(anchor, anchor + addition, 1)

          card_anchor = """        <Pressable\n          onPress={() => router.push('/main/ask')}\n          style={({ pressed }) => [styles.askCard, pressed && styles.pressed]}\n        >"""
          personalized_card = """        {isMother && personalizedAction ? (\n          <>\n            <View style={styles.sectionHeader}>\n              <Text style={styles.sectionTitle}>For you today</Text>\n              <Text style={styles.sectionCaption}>Chosen quietly from the information you already gave Janani.</Text>\n            </View>\n            <Pressable\n              onPress={() => router.push(personalizedAction.route)}\n              style={({ pressed }) => [styles.askCard, pressed && styles.pressed]}\n            >\n              <View style={styles.askIcon}>\n                <Ionicons name={personalizedAction.icon} size={23} color={colors.roseDark} />\n              </View>\n              <View style={styles.flex}>\n                <Text style={styles.actionTitle}>{personalizedAction.title}</Text>\n                <Text style={styles.actionCaption}>{personalizedAction.body}</Text>\n              </View>\n              <Ionicons name=\"arrow-forward\" size={19} color={colors.roseDark} />\n            </Pressable>\n          </>\n        ) : null}\n\n        {personalization?.actionType !== 'ask_food_ideas' ? (\n"""
          if personalized_card not in s:
              if card_anchor not in s: raise SystemExit('Ask card anchor missing')
              s = s.replace(card_anchor, personalized_card + card_anchor, 1)
              close_anchor = """          <Ionicons name=\"arrow-forward\" size={19} color={colors.roseDark} />\n        </Pressable>\n\n        {!isMother ? ("""
              close_new = """          <Ionicons name=\"arrow-forward\" size={19} color={colors.roseDark} />\n        </Pressable>\n        ) : null}\n\n        {!isMother ? ("""
              if close_anchor not in s: raise SystemExit('Ask card close anchor missing')
              s = s.replace(close_anchor, close_new, 1)

          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main/home.tsx
          git commit -m "Wire private daily personalization into Home"
          git push origin HEAD:codex/janani-product-redesign-m8
