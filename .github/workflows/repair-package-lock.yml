name: Temporary Package Lock Repair

on:
  push:
    branches:
      - production/janani-main-candidate-20260815
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/repair-package-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-package-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Refresh package-lock only
    runs-on: ubuntu-24.04
    if: github.repository == 'mkraja826/Janani'
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production/janani-main-candidate-20260815
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile without installing modules
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit package-lock update if needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync."
            exit 0
          fi
          git config user.name "mkraja826"
          git config user.email "37881042+mkraja826@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package lock for nanoid audit fix"
          git push origin HEAD:production/janani-main-candidate-20260815
