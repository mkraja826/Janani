name: M12 Wire

on:
  push:
    branches:
      - codex/janani-product-redesign-m12
    paths:
      - .github/workflows/m12-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m12
      - run: python scripts/m12_wire_i18n.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mkraja826@users.noreply.github.com"
          git add app/main/home.tsx app/main/health.tsx app/main/reports.tsx app/main/journey.tsx app/partner-family.tsx src/i18n/catalog.ts src/components/navigation/JananiOverflowMenu.tsx
          git commit -m "Wire account language through core Janani experience"
          git push origin HEAD:codex/janani-product-redesign-m12
