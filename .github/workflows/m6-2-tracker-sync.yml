name: M6.2 Tracker Sync

on:
  push:
    branches:
      - codex/janani-m6-anaemia-calcium
    paths:
      - .github/workflows/m6-2-tracker-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-m6-anaemia-calcium
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('JANANI_REDESIGN_PROGRESS.md')
          s = p.read_text()
          old = '| 6 | Clinical Safety Engine integration | ANC/red-flag V2 evidence extracted / clinician review + symptom runtime predicate pending | 0 |'
          new = '| 6 | Clinical Safety Engine integration | ANC/red flags + anaemia/IFA/calcium evidence extracted / clinician review + runtime schema gaps pending | 0 |'
          if old not in s:
              raise SystemExit('M6 roadmap row not found')
          s = s.replace(old, new, 1)
          old_check = '- [ ] Remaining India clinical domains extracted and reviewed (anaemia, GDM, hypertension, thyroid, nutrition, food safety, vaccination, postpartum/breastfeeding, medication boundaries).'
          new_check = '- [x] Anaemia / IFA / calcium review candidate extracted from current NHM programme material, ICMR ANC 2025 and the currently listed national calcium guideline.\n- [ ] Complete full 2026 AMB treatment-protocol extraction and reconcile Hb-dependent treatment statements.\n- [ ] Add a typed, provenance-aware haemoglobin/laboratory predicate before any Hb rule can run.\n- [ ] Remaining India clinical domains extracted and reviewed (GDM, hypertension, thyroid, nutrition, food safety, vaccination, postpartum/breastfeeding, medication boundaries).'
          if old_check not in s:
              raise SystemExit('M6 remaining-domain checklist anchor not found')
          s = s.replace(old_check, new_check, 1)
          marker = 'ANC/red-flag V2 is a **clinical-review candidate only**. It contains 16 atomic source concepts and is deliberately not registered because final urgency is unapproved and the current engine cannot safely match symptom identity.'
          addition = marker + '\n\nAnaemia/IFA/calcium V1 is also **clinical-review only**. No supplement dose or Hb threshold is registered. Current programme prophylaxis is separated from clinician-facing treatment statements; Hb-driven logic remains blocked until full AMB 2026 reconciliation, clinician approval and a typed lab-observation predicate exist.'
          if addition not in s:
              if marker not in s:
                  raise SystemExit('M6 candidate marker not found')
              s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mkraja826@users.noreply.github.com"
          git add JANANI_REDESIGN_PROGRESS.md
          git commit -m "Record M6.2 anaemia calcium validation progress"
          git push origin HEAD:codex/janani-m6-anaemia-calcium
