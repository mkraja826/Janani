name: M10 Partner Home Wiring

on:
  push:
    branches:
      - codex/janani-product-redesign-m10
    paths:
      - .github/workflows/m10-partner-home.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m10
      - name: Wire partner-safe Home context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/main/home.tsx')
          s = p.read_text()

          anchor = "import { cacheActivePregnancyId } from '@/features/pregnancy/activePregnancy';\n"
          addition = "import {\n  getCurrentPartnerSupportContext,\n  parsePartnerSupportContext,\n  type PartnerSupportContext,\n} from '@/features/partner/partnerSupport';\n"
          if addition not in s:
              s = s.replace(anchor, addition + anchor, 1)

          old = """  personalization?: DailyPersonalization | null;\n};"""
          new = """  personalization?: DailyPersonalization | null;\n  partnerSupport?: PartnerSupportContext | null;\n};"""
          if old not in s: raise SystemExit('cache type target missing')
          s = s.replace(old, new, 1)

          anchor = """  const [personalization, setPersonalization] = useState<DailyPersonalization | null>(null);\n"""
          addition = """  const [partnerSupport, setPartnerSupport] = useState<PartnerSupportContext | null>(null);\n"""
          if addition not in s:
              s = s.replace(anchor, anchor + addition, 1)

          old = """    setPersonalization(null);\n    setLoadError(false);"""
          new = """    setPersonalization(null);\n    setPartnerSupport(null);\n    setLoadError(false);"""
          if old not in s: raise SystemExit('reset target missing')
          s = s.replace(old, new, 1)

          old = """      setPersonalization(validCache.personalization ?? null);\n      setLoading(false);"""
          new = """      setPersonalization(validCache.personalization ?? null);\n      setPartnerSupport(validCache.partnerSupport ?? null);\n      setLoading(false);"""
          if old not in s: raise SystemExit('cache read target missing')
          s = s.replace(old, new, 1)

          old = """    const [family, reminderItems, reminderHistory, personalizationResult] = await Promise.all(["""
          new = """    const [family, reminderItems, reminderHistory, personalizationResult, partnerSupportResult] = await Promise.all(["""
          if old not in s: raise SystemExit('promise tuple target missing')
          s = s.replace(old, new, 1)

          old = """      membership.data.role === 'mother'\n        ? getCurrentDailyPersonalization()\n        : Promise.resolve({ data: null, error: null }),\n    ]);"""
          new = """      membership.data.role === 'mother'\n        ? getCurrentDailyPersonalization()\n        : Promise.resolve({ data: null, error: null }),\n      membership.data.role === 'partner'\n        ? getCurrentPartnerSupportContext()\n        : Promise.resolve({ data: null, error: null }),\n    ]);"""
          if old not in s: raise SystemExit('promise tail target missing')
          s = s.replace(old, new, 1)

          old = """    const nextSummary: FamilySummary = {\n      role: membership.data.role as FamilySummary['role'],\n      familyName: familyData.name ?? 'Our little family',\n      dueDate: pregnancy?.due_date ?? null,\n    };"""
          new = """    const nextPartnerSupport = membership.data.role === 'partner' && !partnerSupportResult.error\n      ? parsePartnerSupportContext(partnerSupportResult.data)\n      : null;\n    const nextSummary: FamilySummary = {\n      role: membership.data.role as FamilySummary['role'],\n      familyName: nextPartnerSupport?.familyName ?? familyData.name ?? 'Our little family',\n      dueDate: membership.data.role === 'partner'\n        ? nextPartnerSupport?.pregnancy?.dueDate ?? null\n        : pregnancy?.due_date ?? null,\n    };"""
          if old not in s: raise SystemExit('summary target missing')
          s = s.replace(old, new, 1)

          old = """    setPersonalization(nextPersonalization);\n    setOffline(false);"""
          new = """    setPersonalization(nextPersonalization);\n    setPartnerSupport(nextPartnerSupport);\n    setOffline(false);"""
          if old not in s: raise SystemExit('set state target missing')
          s = s.replace(old, new, 1)

          old = """        personalization: nextPersonalization,\n      }),"""
          new = """        personalization: nextPersonalization,\n        partnerSupport: nextPartnerSupport,\n      }),"""
          if old not in s: raise SystemExit('cache write target missing')
          s = s.replace(old, new, 1)

          # Partner should never cache a mother-owned active pregnancy id.
          old = """      cacheActivePregnancyId(userId, activePregnancy?.id ?? null),"""
          new = """      cacheActivePregnancyId(userId, membership.data.role === 'mother' ? activePregnancy?.id ?? null : null),"""
          if old not in s: raise SystemExit('active pregnancy cache target missing')
          s = s.replace(old, new, 1)

          # Pregnancy card: mother keeps existing card; partner gets a privacy-aware shared-progress card.
          start = s.index("        <Pressable\n          onPress={() => router.push('/pregnancy-guide')}\n          style={({ pressed }) => [styles.pregnancyCard, pressed && styles.pressed]}\n        >")
          end_marker = "        </Pressable>\n\n        <View style={styles.sectionHeader}>"
          end = s.index(end_marker, start) + len("        </Pressable>\n")
          original = s[start:end]
          replacement = """        {isMother ? (\n""" + original.replace("        <Pressable", "          <Pressable").replace("\n        ", "\n          ") + """        ) : (\n          <Pressable\n            onPress={() => router.push('/partner-family')}\n            style={({ pressed }) => [styles.pregnancyCard, pressed && styles.pressed]}\n          >\n            <View style={styles.pregnancyIcon}>\n              <Ionicons name={partnerSupport?.pregnancyProgressShared ? 'heart-circle' : 'lock-closed'} size={36} color={colors.rose} />\n            </View>\n            <View style={styles.flex}>\n              <Text style={styles.cardEyebrow}>SHARED PREGNANCY</Text>\n              {partnerSupport?.pregnancyProgressShared && progress ? (\n                <>\n                  <Text style={styles.week}>Week {progress.gestationalWeek}</Text>\n                  <Text style={styles.cardTitle}>{trimesterLabel(progress.trimester)}</Text>\n                  <Text style={styles.cardMeta}>{progress.daysRemaining} days until the estimated due date</Text>\n                </>\n              ) : (\n                <>\n                  <Text style={styles.cardTitle}>Pregnancy progress is private right now</Text>\n                  <Text style={styles.cardMeta}>You can still support, send warmth and ask general pregnancy questions.</Text>\n                </>\n              )}\n            </View>\n            <Ionicons name=\"chevron-forward\" size={20} color={colors.roseDark} />\n          </Pressable>\n        )}\n"""
          s = s[:start] + replacement + s[end:]

          s = s.replace(
            """          <Text style={styles.sectionTitle}>What matters today</Text>\n          <Text style={styles.sectionCaption}>Janani keeps the list short and puts the next care item first.</Text>""",
            """          <Text style={styles.sectionTitle}>{isMother ? 'What matters today' : 'How you can help today'}</Text>\n          <Text style={styles.sectionCaption}>{isMother ? 'Janani keeps the list short and puts the next care item first.' : 'Keep support simple: notice the next shared care item, check in, and be there when needed.'}</Text>""",
            1,
          )

          s = s.replace(
            """              {priority ? 'NEXT CARE' : care.total === 0 ? 'TODAY’S CARE' : 'CARE CHECKED'}""",
            """              {priority ? (isMother ? 'NEXT CARE' : 'NEXT SHARED REMINDER') : care.total === 0 ? (isMother ? 'TODAY’S CARE' : 'TODAY’S SUPPORT') : 'CARE CHECKED'}""",
            1,
          )

          # Insert partner support actions before generic Ask.
          ask_anchor = """        {personalization?.actionType !== 'ask_food_ideas' ? (\n        <Pressable\n          onPress={() => router.push('/main/ask')}"""
          partner_block = """        {!isMother ? (\n          <>\n            {partnerSupport?.careTimelineShared && partnerSupport.upcomingAppointments[0] ? (\n              <Pressable onPress={() => router.push('/partner-family')} style={({ pressed }) => [styles.askCard, pressed && styles.pressed]}>\n                <View style={styles.askIcon}><Ionicons name=\"calendar-outline\" size={23} color={colors.roseDark} /></View>\n                <View style={styles.flex}>\n                  <Text style={styles.actionTitle}>An appointment is coming up</Text>\n                  <Text style={styles.actionCaption}>{new Date(partnerSupport.upcomingAppointments[0].scheduledAt).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })} · Ask if help with travel, notes or company would make the day easier.</Text>\n                </View>\n                <Ionicons name=\"chevron-forward\" size={19} color={colors.muted} />\n              </Pressable>\n            ) : null}\n            <Pressable onPress={() => router.push('/thinking-of-you')} style={({ pressed }) => [styles.partnerCard, pressed && styles.pressed]}>\n              <Ionicons name=\"heart\" size={22} color={colors.roseDark} />\n              <View style={styles.flex}>\n                <Text style={styles.actionTitle}>Thinking of you</Text>\n                <Text style={styles.actionCaption}>A small signal can say “I’m here with you” without asking for anything back.</Text>\n              </View>\n              <Ionicons name=\"chevron-forward\" size={19} color={colors.muted} />\n            </Pressable>\n          </>\n        ) : null}\n\n"""
          if partner_block not in s:
              if ask_anchor not in s: raise SystemExit('ask anchor missing')
              s = s.replace(ask_anchor, partner_block + ask_anchor, 1)

          s = s.replace(
            """            <Text style={styles.actionCaption}>Ask Janani a pregnancy or maternal-wellness question.</Text>""",
            """            <Text style={styles.actionCaption}>{isMother ? 'Ask Janani a pregnancy or maternal-wellness question.' : 'Ask Janani a general pregnancy or partner-support question. Mother-private health information is not used here.'}</Text>""",
            1,
          )

          # Remove the old duplicate partner Thinking of You block.
          old_partner = """        {!isMother ? (\n          <Pressable\n            onPress={() => router.push('/thinking-of-you')}\n            style={({ pressed }) => [styles.partnerCard, pressed && styles.pressed]}\n          >\n            <Ionicons name=\"heart-outline\" size={22} color={colors.roseDark} />\n            <View style={styles.flex}>\n              <Text style={styles.actionTitle}>Thinking of you</Text>\n              <Text style={styles.actionCaption}>Send a little warmth without interrupting the day.</Text>\n            </View>\n            <Ionicons name=\"chevron-forward\" size={19} color={colors.muted} />\n          </Pressable>\n        ) : null}\n\n"""
          if old_partner in s:
              s = s.replace(old_partner, '', 1)

          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main/home.tsx
          git commit -m "Redesign partner Home around support and privacy"
          git push origin HEAD:codex/janani-product-redesign-m10
