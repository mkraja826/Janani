name: Janani Icon Recovery Probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'codex/janani-product-redesign-m1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Install Pillow
        run: python3 -m pip install --user --disable-pip-version-check --no-input pillow
      - name: Normalize approved Janani icon
        run: |
          python3 <<'PY'
          import base64
          import pathlib
          from PIL import Image, ImageFile

          root = pathlib.Path('.')
          parts = sorted((root / 'assets/branding/janani-app-icon.parts').glob('*.b64part'))
          raw = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          source = root / 'assets/.approved-icon-source.png'
          output = root / 'assets/branding/janani-app-icon.normalized.png'
          source.write_bytes(raw)

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open(source) as img:
              img.load()
              if img.size != (384, 384):
                  raise SystemExit(f'Unexpected approved icon size: {img.size}')
              img.convert('RGBA').save(output, format='PNG', optimize=False)

          source.unlink(missing_ok=True)
          print(f'Wrote {output} ({output.stat().st_size} PNG bytes)')
          PY
      - name: Commit normalized PNG when changed
        run: |
          if git diff --quiet -- assets/branding/janani-app-icon.normalized.png && git ls-files --error-unmatch assets/branding/janani-app-icon.normalized.png >/dev/null 2>&1; then
            echo "Normalized icon PNG already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/janani-app-icon.normalized.png
          git commit -m "fix: commit normalized approved Janani app icon"
          git push origin HEAD:${{ github.head_ref }}
