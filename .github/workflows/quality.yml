name: Janani Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Expo, legal site, and Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: npm ci --no-audit --no-fund
      - run: npm run audit:production
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - run: node .github/scripts/validate-legal-site.mjs
      - run: npx expo config --type public
      - name: Repair and verify approved launcher icon
        run: |
          set -euo pipefail
          if node - <<'NODE'
          const Jimp = require('jimp-compact');
          Jimp.read('assets/.generated-janani-app-icon.png')
            .then(() => process.exit(0))
            .catch((error) => { console.error(error.message); process.exit(1); });
          NODE
          then
            cp assets/.generated-janani-app-icon.png assets/.verified-janani-app-icon.png
          else
            command -v convert
            convert assets/.generated-janani-app-icon.png -strip PNG32:assets/.verified-janani-app-icon.png
          fi
          node - <<'NODE'
          const Jimp = require('jimp-compact');
          Jimp.read('assets/.verified-janani-app-icon.png')
            .then((image) => console.log(`PNG_REPAIR_OK ${image.bitmap.width}x${image.bitmap.height}`))
            .catch((error) => { console.error(`PNG_REPAIR_FAIL ${error.message}`); process.exit(2); });
          NODE
          cp assets/.verified-janani-app-icon.png assets/.generated-janani-app-icon.png
      - name: Upload verified approved launcher icon
        uses: actions/upload-artifact@v4
        with:
          name: janani-approved-icon-verified
          path: assets/.verified-janani-app-icon.png
          if-no-files-found: error
          retention-days: 1
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Verify widget generation
        run: |
          test -f android/app/src/main/java/com/mkraja826/janani/JananiWidgetModule.kt
          test -f android/app/src/main/java/com/mkraja826/janani/JananiWidgetPackage.kt
          test -f android/app/src/main/java/com/mkraja826/janani/JananiCareWidget.kt
          test -f android/app/src/main/res/layout/janani_care_widget.xml
          grep -Eq '^[[:space:]]*(packages\.)?add\(JananiWidgetPackage\(\)\)[[:space:]]*$' android/app/src/main/java/com/mkraja826/janani/MainApplication.kt
      - name: Compile Android x86_64 debug APK
        working-directory: android
        env:
          NODE_ENV: development
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace --no-daemon --max-workers=2 --console=plain
