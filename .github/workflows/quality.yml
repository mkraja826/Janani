name: Janani Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Expo, legal site, and Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Sync inherited npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synced lockfile to milestone branch
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/janani-product-redesign-m1'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          void (async () => {
            const repo = process.env.GITHUB_REPOSITORY;
            const ref = process.env.HEAD_REF;
            const token = process.env.GH_TOKEN;
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            };
            const currentResponse = await fetch(`https://api.github.com/repos/${repo}/contents/package-lock.json?ref=${encodeURIComponent(ref)}`, { headers });
            if (!currentResponse.ok) throw new Error(`Could not read package-lock.json: ${currentResponse.status}`);
            const current = await currentResponse.json();
            const content = fs.readFileSync('package-lock.json', 'utf8');
            const nextBase64 = Buffer.from(content).toString('base64');
            if (current.content?.replace(/\n/g, '') === nextBase64) {
              console.log('package-lock.json is already synchronized.');
              return;
            }
            const updateResponse = await fetch(`https://api.github.com/repos/${repo}/contents/package-lock.json`, {
              method: 'PUT',
              headers,
              body: JSON.stringify({
                message: 'chore: sync npm lockfile after Firebase dependencies',
                content: nextBase64,
                sha: current.sha,
                branch: ref,
              }),
            });
            if (!updateResponse.ok) {
              const body = await updateResponse.text();
              throw new Error(`Could not commit package-lock.json: ${updateResponse.status} ${body}`);
            }
            console.log('Committed synchronized package-lock.json to the milestone branch.');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - run: node .github/scripts/validate-legal-site.mjs
      - run: npx expo config --type public
      - run: npx expo prebuild --platform android --clean --no-install
      - name: Verify widget generation
        run: |
          test -f android/app/src/main/java/com/mkraja826/janani/JananiWidgetModule.kt
          test -f android/app/src/main/java/com/mkraja826/janani/JananiWidgetPackage.kt
          test -f android/app/src/main/java/com/mkraja826/janani/JananiCareWidget.kt
          test -f android/app/src/main/res/layout/janani_care_widget.xml
          grep -Eq '^[[:space:]]*(packages\.)?add\(JananiWidgetPackage\(\)\)[[:space:]]*$' android/app/src/main/java/com/mkraja826/janani/MainApplication.kt
      - name: Compile Android x86_64 debug APK
        working-directory: android
        env:
          NODE_ENV: development
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace --no-daemon --max-workers=2 --console=plain
