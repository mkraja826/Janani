name: Refresh Janani Lockfile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'codex/production-reconciliation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/production-reconciliation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify regenerated lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync Firebase dependency lockfile"
          git push origin HEAD:codex/production-reconciliation
