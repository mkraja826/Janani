name: M4 Lint Fix

on:
  push:
    branches:
      - codex/janani-product-redesign-m4
    paths:
      - .github/workflows/m4-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/janani-product-redesign-m4
      - name: Escape JSX apostrophe
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/report-detail.tsx')
          s = p.read_text()
          old = "will stay outside Janani's trusted context until reviewed."
          new = "will stay outside Janani’s trusted context until reviewed."
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/report-detail.tsx
          git commit -m "Fix report review lint text"
          git push origin HEAD:codex/janani-product-redesign-m4
